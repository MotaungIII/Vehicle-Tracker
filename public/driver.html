<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>GOTV Vehicle Locator · Driver GPS</title><style>body{font:16px system-ui;background:#eef5fb;color:#163858;margin:0}header{background:#062a53;color:#fff;padding:19px}main{max-width:520px;margin:25px auto;padding:15px}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 3px 16px #1232}button{background:#0874ca;color:white;border:0;border-radius:8px;padding:14px;margin:5px;cursor:pointer;font-weight:bold}button:disabled{opacity:.4}button.stop{background:#a32f2f}.status{white-space:pre-wrap;background:#eaf4ff;padding:15px;border-radius:8px}select{padding:10px;width:100%}.driver-brand{display:flex;align-items:center;gap:13px}.driver-brand img{background:#fff;width:58px;height:58px;object-fit:contain;border-radius:12px;padding:5px}.driver-brand b{font-size:20px;display:block}.driver-brand small{display:block;color:#cee8ff;font-size:11px;margin-top:3px;letter-spacing:.045em}.link-label{font-size:12px;color:#c7def2;margin:7px 0 0 71px}header{border-bottom:4px solid #1686d8}button:focus-visible{outline:3px solid #f4cc3b;outline-offset:2px}</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0874ca"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vehicle Locator"><link rel="apple-touch-icon" href="/icon-192.png"><script>if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></head><body><header><div class="driver-brand"><span aria-hidden="true" style="font-size:32px">📍</span><div><b>Vehicle Locator</b><small>Independent Vehicle Tracking · Driver Portal</small></div></div><div class="link-label">Secure driver link</div></header><main><div class="card"><h2 id="name">Checking your link…</h2><p id="assignment"></p><p id="expiry"></p><div><button id="in">Clock in</button><button id="out" class="stop">Clock out</button></div><div><button id="start">Start GPS sharing</button><button id="stop" class="stop">Stop GPS sharing</button></div><p><label>Driving status <select id="status"><option>En route</option><option>At station</option><option>Idle</option><option>Breakdown</option></select></label></p><p class="status" id="info">Your phone will ask for location permission when GPS starts.</p><h3>Zone messages</h3><div id="messages"></div><small>Keep this page open while sharing. GPS may pause when the phone locks. HTTPS and location permission are required.</small></div></main><script>
const $=id=>document.getElementById(id),secret=new URLSearchParams(location.hash.substring(1)).get('token');history.replaceState({},'',location.pathname);let watch=null,vehicle=null,pending=false,lastSent=0;
async function api(route,method='GET',data){let r=await fetch('/api/link/'+route,{method,headers:{Authorization:'Bearer '+secret,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function info(s){$('info').textContent=s}function stopWatch(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null}
async function refresh(){try{let x=await api('state');vehicle=x.vehicle;$('name').textContent=vehicle.label;$('assignment').textContent=[vehicle.plate,'Zone '+vehicle.zone,'VD '+(vehicle.stationId||'Unassigned'),vehicle.status].join(' · ');$('expiry').textContent='Access expires '+new Date(x.expires).toLocaleString();$('in').disabled=vehicle.onDuty;$('out').disabled=!vehicle.onDuty;$('start').disabled=!vehicle.onDuty||watch!==null;$('stop').disabled=!vehicle.onDuty||!vehicle.trackingEnabled;const box=$('messages');box.replaceChildren(...x.messages.slice(-10).map(m=>{let p=document.createElement('p');p.textContent=m.from+': '+m.message;return p}));if(!vehicle.onDuty||!vehicle.trackingEnabled)stopWatch()}catch(e){stopWatch();info(e.message);document.querySelectorAll('button').forEach(b=>b.disabled=true)}}
$('in').onclick=async()=>{try{await api('clock','POST',{action:'in'});info('Clocked in. Choose Start GPS when ready.');refresh()}catch(e){info(e.message)}};
$('out').onclick=async()=>{stopWatch();try{await api('clock','POST',{action:'out'});info('Clocked out. GPS no longer shared.');refresh()}catch(e){info(e.message)}};
$('start').onclick=async()=>{if(!isSecureContext||!navigator.geolocation){info('GPS needs HTTPS and a location-enabled browser.');return}try{await api('tracking','POST',{enabled:true});watch=navigator.geolocation.watchPosition(async p=>{let time=Date.now();if(pending||time-lastSent<4000)return;pending=true;try{let r=await api('location','POST',{lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,status:$('status').value});lastSent=time;info('GPS shared: '+new Date(r.time).toLocaleTimeString()+' · accuracy ±'+Math.round(p.coords.accuracy)+'m')}catch(e){info('GPS upload failed: '+e.message)}finally{pending=false}},e=>info('GPS permission/error: '+e.message),{enableHighAccuracy:true,maximumAge:3000,timeout:30000});info('GPS sharing requested. Allow location access.');refresh()}catch(e){info(e.message)}};
$('stop').onclick=async()=>{stopWatch();try{await api('tracking','POST',{enabled:false});info('GPS stopped and current location removed.');refresh()}catch(e){info(e.message)}};
window.addEventListener('pagehide',stopWatch);if(!secret){info('Missing driver access link')}else{refresh();setInterval(()=>{if(!document.hidden)refresh()},5000)}
</script></body></html>
