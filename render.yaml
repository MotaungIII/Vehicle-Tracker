services:
  - type: web
    name: da-gotv-car-tracker-trial
    runtime: node
    plan: starter
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOTV_DATA_DIR
        value: /var/data
      - key: GOTV_MANAGER_USER
        value: manager
      - key: GOTV_MANAGER_PASSWORD
        sync: false
    disk:
      name: gotv-trial-data
      mountPath: /var/data
      sizeGB: 1
